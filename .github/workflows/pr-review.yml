---
name: Auto PR Review
on:
    pull_request:
        types: [opened, synchronize]

jobs:
    review:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: read
            id-token: write
            actions: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Review PR with Claude
              uses: anthropics/claude-code-action@c81e3bc69d1b18badbb63ba39581218f02421678 # v1 (c81e3bc fails: "directory mismatch" internal error 2026-08-23 - hold until fixed upstream)
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  prompt: Review this PR for code quality, security, and completeness. Check for potential issues and suggest improvements.
