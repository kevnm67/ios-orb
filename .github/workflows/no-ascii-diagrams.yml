name: No ASCII diagrams

on:
  pull_request:
    paths: ["**/*.md", "scripts/ci/check-no-ascii-diagrams.py"]
  push:
    branches: [main]
    paths: ["**/*.md", "scripts/ci/check-no-ascii-diagrams.py"]

permissions:
  contents: read

concurrency:
  group: no-ascii-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-ascii-diagrams:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: No ASCII diagrams (use D2)
        run: python3 -I scripts/ci/check-no-ascii-diagrams.py
