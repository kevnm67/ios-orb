---
version: 2.1
setup: true
orbs:
    orb-tools: circleci/orb-tools@12.5.0
    qlty: qltysh/qlty-orb@0.1.2
    shellcheck: circleci/shellcheck@3.4.0

filters: &filters
    tags:
        only: /.*/

jobs:
    script-tests:
        docker:
            - image: cimg/base:current
        steps:
            - checkout
            - restore_cache:
                  keys:
                      - kcov-v43-{{ arch }}
            - run:
                  name: Install bats-core and kcov
                  command: ./scripts/ci/install-script-test-deps.sh
            - save_cache:
                  key: kcov-v43-{{ arch }}
                  paths:
                      - ~/kcov
            - run:
                  name: Run bats + kcov coverage
                  command: ./scripts/ci/run-script-tests.sh
            - run:
                  name: hook-tests
                  command: bats tests/hooks tests/ci
            - qlty/coverage_publish:
                  files: coverage/cobertura.xml
                  format: cobertura

workflows:
    lint-pack:
        jobs:
            - orb-tools/lint:
                  filters: *filters
            - orb-tools/pack:
                  filters: *filters
            - orb-tools/review:
                  orb_name: ios-orb
                  exclude: RC006,RC007,RC008,RC009
                  filters: *filters
            - shellcheck/check:
                  filters: *filters
            - script-tests:
                  context: qlty-credentials
                  filters: *filters
            - orb-tools/continue:
                  pipeline_number: << pipeline.number >>
                  vcs_type: << pipeline.project.type >>
                  orb_name: ios-orb
                  requires: [orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check, script-tests]
                  filters: *filters
