---
description: >
    Minimal Swift package CI. The build_and_test_spm job builds, runs
    `swift test --enable-code-coverage --parallel` (XCTest and Swift Testing),
    exports lcov via llvm-cov and uploads it to Qlty Cloud — one job, no
    inline shell. Requires QLTY_COVERAGE_TOKEN in the referenced context.
usage:
    version: 2.1
    orbs:
        ios-orb: kevnm67/ios-orb@3.2.0
    workflows:
        ci:
            jobs:
                - ios-orb/build_and_test_spm:
                      name: build-and-test
                      xcode_version: '26.6'
                      context: ios_auth  # your context holding QLTY_COVERAGE_TOKEN
                - ios-orb/build_and_test_spm:
                      name: release-build
                      xcode_version: '26.6'
                      configuration: release
                      build_flags: -Xswiftc -warnings-as-errors
                      coverage: false
