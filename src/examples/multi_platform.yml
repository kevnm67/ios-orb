---
description: >
    Dual-platform Fastlane CI for an XcodeGen app: setup once, then one
    `test` job per lane (`test_ios` → iPhone 17 simulator, `test_macos` →
    macOS) in parallel. Each lane's scan run writes its own xcresult bundle,
    and coverage is uploaded with a per-platform Qlty tag.
usage:
    version: 2.1
    orbs:
        ios-orb: kevnm67/ios-orb@3.1.1
    workflows:
        multi-platform:
            jobs:
                - ios-orb/run_with_setup:
                      name: setup
                      xcode_version: '26.6'
                      xcode_project: MyApp
                      scripts:
                          - ios-orb/install_tools:
                                tools: xcodegen
                          - ios-orb/xcodegen
                - ios-orb/test:
                      name: test-ios
                      xcode_version: '26.6'
                      xcode_project: MyApp
                      lane: test_ios
                      result_bundle_path: ios.xcresult
                      qlty_tag: ios
                      requires:
                          - setup
                      context: ios_auth  # your context holding QLTY_COVERAGE_TOKEN
                - ios-orb/test:
                      name: test-macos
                      xcode_version: '26.6'
                      xcode_project: MyApp
                      lane: test_macos
                      result_bundle_path: macos.xcresult
                      qlty_tag: macos
                      requires:
                          - setup
                      context: ios_auth  # your context holding QLTY_COVERAGE_TOKEN
