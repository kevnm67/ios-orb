---
description: >
    Dual-platform CI for an XcodeGen app: one build_and_test_xcode job per
    destination (iOS Simulator + macOS). Both jobs generate the project,
    build, test with coverage, store JUnit results and upload tagged
    coverage to Qlty Cloud so the reports stay separate per platform.
usage:
    version: 2.1
    orbs:
        ios-orb: kevnm67/ios-orb@3.1.0
    workflows:
        multi-platform:
            jobs:
                - ios-orb/build_and_test_xcode:
                      name: test-ios
                      scheme: MyApp
                      xcode_version: '26.6'
                      xcodegen: true
                      xcode_project: MyApp
                      destination: platform=iOS Simulator,name=iPhone 17
                      result_bundle_path: ios.xcresult
                      context: qlty-credentials
                - ios-orb/build_and_test_xcode:
                      name: test-macos
                      scheme: MyApp
                      xcode_version: '26.6'
                      xcodegen: true
                      xcode_project: MyApp
                      destination: platform=macOS
                      result_bundle_path: macos.xcresult
                      context: qlty-credentials
