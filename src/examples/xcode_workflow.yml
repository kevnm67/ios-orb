---
description: >
    Recommended Fastlane workflow for an XcodeGen iOS app: a setup job
    generates the project and persists the workspace, then the test job runs
    the `test` lane (scan handles the simulator, xcresult and JUnit output),
    exports cobertura coverage and uploads it to Qlty Cloud.
usage:
    version: 2.1
    orbs:
        ios-orb: kevnm67/ios-orb@3.2.0
    workflows:
        build-test:
            jobs:
                - ios-orb/run_with_setup:
                      name: setup
                      xcode_version: '26.6'
                      xcode_project: MyApp
                      scripts:
                          - ios-orb/install_tools:
                                tools: xcodegen swiftlint
                          - ios-orb/xcodegen
                - ios-orb/test:
                      name: test
                      xcode_version: '26.6'
                      xcode_project: MyApp
                      lane: test
                      pretest_steps:
                          - ios-orb/swiftlint:
                                strict: true
                      qlty_tag: unit
                      requires:
                          - setup
                      context: ios_auth  # your context holding QLTY_COVERAGE_TOKEN
