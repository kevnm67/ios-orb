---
description: >
    Single-job CI for an XcodeGen iOS app: generate the project, SwiftLint
    in strict mode, build and test on the iPhone 17 simulator, export
    cobertura coverage from the xcresult bundle and upload it to Qlty Cloud.
usage:
    version: 2.1
    orbs:
        ios-orb: kevnm67/ios-orb@3.1.0
    workflows:
        build-test:
            jobs:
                - ios-orb/build_and_test_xcode:
                      scheme: MyApp
                      xcode_version: '26.6'
                      xcodegen: true
                      xcode_project: MyApp
                      destination: platform=iOS Simulator,name=iPhone 17
                      pre_steps:
                          - ios-orb/swiftlint:
                                strict: true
                      context: qlty-credentials
