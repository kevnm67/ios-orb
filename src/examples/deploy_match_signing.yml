---
description: >
    Main-only deploy workflow: setup syncs read-only App Store signing via
    Fastlane match, then runs the beta lane to build and ship (your Fastfile
    lane can call upload_to_testflight itself, or you can drop it for
    ios-orb/deploy_testflight if there's no Fastfile). Notifies Slack on
    failure. Requires match's own environment variables (MATCH_PASSWORD,
    etc.), the Qlty coverage token, and a Slack webhook, all supplied via
    CircleCI contexts.
usage:
    version: 2.1
    orbs:
        ios-orb: kevnm67/ios-orb@3.4.0
    workflows:
        deploy:
            when:
                equal: [main, << pipeline.git.branch >>]
            jobs:
                - ios-orb/run_with_setup:
                      name: deploy
                      xcode_version: '26.6'
                      xcode_project: MyApp
                      scripts:
                          - ios-orb/match_signing:
                                type: appstore
                                readonly: true
                          - ios-orb/lane:
                                named: beta
                          # No Fastfile lane? Replace the step above with:
                          #   - ios-orb/deploy_testflight:
                          #         groups: "Internal Testers"
                          - ios-orb/notify_slack:
                                on: fail
                      context:
                          - ios_auth      # your context holding QLTY_COVERAGE_TOKEN
                          - match_certs   # your context holding MATCH_PASSWORD, MATCH_APP_IDENTIFIER
                          - slack_alerts  # your context holding SLACK_WEBHOOK
