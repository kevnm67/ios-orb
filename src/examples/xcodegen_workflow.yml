---
description: >
    Two-stage Fastlane workflow using the macos executor directly:
    a setup job generates the XcodeGen project, installs gems and persists
    the workspace; a test job attaches it and runs the Fastlane lane.
    Use this shape when you need full control over executor steps.
usage:
    version: 2.1
    orbs:
        ios-orb: kevnm67/ios-orb@3.4.0
    jobs:
        setup:
            executor:
                name: ios-orb/macos
            steps:
                - checkout
                - ios-orb/install_tools:
                      tools: xcodegen swiftlint
                - ios-orb/xcodegen
                - run:
                      name: Install gems
                      command: |
                          bundle config set --local path vendor/bundle
                          bundle install
                - persist_to_workspace:
                      root: .
                      paths:
                          - .
        test:
            executor:
                name: ios-orb/macos
            steps:
                - attach_workspace:
                      at: .
                - ios-orb/lane:
                      named: test
                - store_test_results:
                      path: test-results
    workflows:
        build-test:
            jobs:
                - setup
                - test:
                      requires:
                          - setup
