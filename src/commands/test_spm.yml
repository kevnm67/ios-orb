---
description: |
    Run tests for a Swift Package Manager project with optional code coverage.
    Pipes output through xcbeautify for readable results and a JUnit report.

parameters:
    filter:
        description: Test filter pattern (e.g. "MyModuleTests" or "MyModuleTests/testSpecificCase").
        type: string
        default: ''
    parallel:
        description: Whether to run tests in parallel.
        type: boolean
        default: true
    coverage:
        description: Whether to enable code coverage collection.
        type: boolean
        default: true
    report_path:
        description: Directory the JUnit report is written to and stored from.
        type: string
        default: build/reports
    test_framework:
        description: |
            Which test framework to run: "auto" detects Swift Testing by
            grepping Tests/ for "import Testing" (falling back to xctest),
            "xctest" and "swift-testing" force a framework. swift-testing
            forces --parallel and writes an xunit report via `swift test
            --xunit-output` instead of xcbeautify's JUnit reporter.
        type: enum
        enum: [auto, xctest, swift-testing]
        default: auto

steps:
    - run:
          name: Install xcbeautify
          command: << include(scripts/xcbeautify_install.sh) >>
    - run:
          name: Run SPM tests
          environment:
              FILTER: << parameters.filter >>
              PARALLEL: << parameters.parallel >>
              COVERAGE: << parameters.coverage >>
              REPORT_PATH: << parameters.report_path >>
              TEST_FRAMEWORK: << parameters.test_framework >>
          command: << include(scripts/spm_test.sh) >>
    - store_test_results:
          path: << parameters.report_path >>
