---
description: |
    Run tests for an Xcode project with code coverage.
    Exports JUnit XML results and stores them for CircleCI test insights.

parameters:
    scheme:
        description: The Xcode scheme to test.
        type: string
    project:
        description: Path to the .xcodeproj file. Leave empty to use the default project in the directory.
        type: string
        default: ''
    destination:
        description: Test destination (e.g. "platform=macOS" or "platform=iOS Simulator,name=iPhone 17").
        type: string
        default: platform=macOS
    result_bundle_path:
        description: Path to store the xcresult bundle.
        type: string
        default: TestResults.xcresult
    junit_report:
        description: Path of the JUnit XML report written by xcbeautify and stored as test results.
        type: string
        default: test-results.xml
    retry_on_failure:
        description: Whether to retry only the tests that failed (xcodebuild -retry-tests-on-failure).
        type: boolean
        default: false
    test_iterations:
        description: Maximum iterations per test when retry_on_failure is enabled (xcodebuild -test-iterations).
        type: integer
        default: 3
    test_target:
        description: |
            Test target name used to scope "-only-testing" filters when a
            test-splits file is present on TEST_SPLITS_FILE (see the
            build_and_test_xcode job's split_tests parameter). Leave empty
            to default to the scheme name.
        type: string
        default: ''
    junit_source:
        description: |
            How to produce the JUnit report: "xcbeautify" (default) uses
            xcbeautify's own JUnit reporter. "xcresultparser" runs plain
            xcodebuild through xcbeautify (no report) and separately
            converts the xcresult bundle to JUnit XML with xcresultparser,
            installing it via Homebrew if missing.
        type: enum
        enum: [xcbeautify, xcresultparser]
        default: xcbeautify

steps:
    - run:
          name: Install xcbeautify
          command: << include(scripts/xcbeautify_install.sh) >>
    - run:
          name: Run Xcode tests
          environment:
              SCHEME: << parameters.scheme >>
              PROJECT: << parameters.project >>
              DESTINATION: << parameters.destination >>
              RESULT_BUNDLE_PATH: << parameters.result_bundle_path >>
              JUNIT_REPORT: << parameters.junit_report >>
              RETRY_ON_FAILURE: << parameters.retry_on_failure >>
              TEST_ITERATIONS: << parameters.test_iterations >>
              TEST_TARGET: << parameters.test_target >>
              JUNIT_SOURCE: << parameters.junit_source >>
          command: << include(scripts/xcodebuild_test.sh) >>
    - store_test_results:
          path: << parameters.junit_report >>
