---
description: |
    Build an Xcode project or workspace.
    Pipes output through xcbeautify for readable build logs.

parameters:
    scheme:
        description: The Xcode scheme to build.
        type: string
    project:
        description: Path to the .xcodeproj file. Leave empty to use the default project in the directory.
        type: string
        default: ''
    destination:
        description: Build destination (e.g. "platform=macOS" or "platform=iOS Simulator,name=iPhone 17").
        type: string
        default: platform=macOS
    configuration:
        description: Build configuration (Debug or Release).
        type: string
        default: Debug
    xcargs:
        description: |
            Extra xcodebuild arguments or build settings, word-split and
            appended to the invocation (e.g. "CODE_SIGNING_ALLOWED=NO" for
            unsigned builds). Leave empty for none.
        type: string
        default: ''
    step_timeout:
        description: |
            Wall-clock limit in seconds for this step (0 = no limit). On
            expiry the step's process group is terminated and the step
            fails with exit code 124 and an explicit "exceeded its Ns
            timeout" message. Independent of CircleCI's no_output_timeout.
        type: integer
        default: 0

steps:
    - run:
          name: Install xcbeautify
          command: << include(scripts/xcbeautify_install.sh) >>
    - run:
          name: Build Xcode project
          environment:
              SCHEME: << parameters.scheme >>
              PROJECT: << parameters.project >>
              DESTINATION: << parameters.destination >>
              CONFIGURATION: << parameters.configuration >>
              XCARGS: << parameters.xcargs >>
              STEP_TIMEOUT: << parameters.step_timeout >>
          command: << include(scripts/xcodebuild_build.sh) >>
