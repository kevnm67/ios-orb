---
description: |
    Cache swift packages.
    The checksum keys on the Xcode project's Package.resolved when
    xcode_project is set, falling back to the root Package.resolved for pure
    SPM packages (an empty key file is used when neither exists).
parameters:
    key:
        description: Cache key (prefixed).  The key is immutable.
        type: string
        default: spm-v2
    xcode_project:
        description: |
            Name of your xcodeproj for setting the path to the Package.resolved
            file. Leave empty for pure SPM packages to key on the root
            Package.resolved.
        type: string
        default: ''
    path:
        description: |
            Path where swift packages to be cached are located. Defaults to
            the Xcode-managed SourcePackages path; pure SPM packages must
            pass path: .build (or wherever `swift build` writes .build).
        type: string
        default: .build_output/SourcePackages
steps:
    - run:
          name: Resolve SPM cache key
          environment:
              XCODE_PROJECT: << parameters.xcode_project >>
          command: <<include(scripts/resolve_spm_cache_key.sh)>>
    - run:
          name: Check SPM cache path
          environment:
              CACHE_PATH: << parameters.path >>
          command: <<include(scripts/check_cache_path.sh)>>
    - save_cache:
          key: << parameters.key >>-{{ arch }}-{{ .Branch }}-{{ checksum "Package.resolved.cache-key" }}
          paths:
              - << parameters.path >>
