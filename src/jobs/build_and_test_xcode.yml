---
description: |
    Complete CI job for Xcode projects.
    Optionally runs XcodeGen, builds, tests, exports coverage, and uploads to Qlty Cloud.

executor:
    name: macos
    xcode_version: <<parameters.xcode_version>>
    resource_class: <<parameters.resource_class>>

parameters:
    scheme:
        description: The Xcode scheme to build and test.
        type: string
    xcode_version:
        description: Xcode version.
        type: string
        default: '26.6'
    resource_class:
        description: macOS resource class.
        type: string
        default: m4pro.medium
    xcodegen:
        description: Whether to generate the Xcode project with XcodeGen before building.
        type: boolean
        default: false
    project:
        description: Path to the .xcodeproj file. Leave empty to use the default project.
        type: string
        default: ''
    destination:
        description: Build and test destination.
        type: string
        default: platform=macOS
    configuration:
        description: Build configuration.
        type: string
        default: Debug
    result_bundle_path:
        description: Path to store the xcresult bundle.
        type: string
        default: TestResults.xcresult
    parallelism:
        description: CircleCI parallelism level.
        type: integer
        default: 1
    coverage:
        description: Whether to export code coverage.
        type: boolean
        default: true
    qlty:
        description: Whether to upload coverage to Qlty Cloud.
        type: boolean
        default: true
    xcode_project:
        description: Name of your xcodeproj for SPM cache key (without .xcodeproj extension).
        type: string
        default: ''
    pre_steps:
        description: Steps to run before build.
        type: steps
        default: []
    junit_report:
        description: Path of the JUnit XML report written by xcbeautify and stored as test results.
        type: string
        default: test-results.xml
    preboot_simulator:
        description: Whether to preboot the Simulator device parsed from destination before building (no-op for non-simulator destinations).
        type: boolean
        default: false
    retry_on_failure:
        description: Whether to retry only the tests that failed (xcodebuild -retry-tests-on-failure).
        type: boolean
        default: false
    test_iterations:
        description: Maximum iterations per test when retry_on_failure is enabled (xcodebuild -test-iterations).
        type: integer
        default: 3
    allow_beta_xcode:
        description: Whether to allow a beta/build-string xcode_version (e.g. "27A5228h") instead of failing fast.
        type: boolean
        default: false

parallelism: << parameters.parallelism >>

steps:
    - assert_xcode_channel:
          xcode_version: << parameters.xcode_version >>
          allow_beta: << parameters.allow_beta_xcode >>
    - checkout
    - << parameters.pre_steps >>
    - when:
          condition: << parameters.xcodegen >>
          steps:
              - install_tools:
                    tools: xcodegen
              - xcodegen
    - when:
          condition: << parameters.xcode_project >>
          steps:
              - restore_spm_cache:
                    xcode_project: << parameters.xcode_project >>
    - when:
          condition: << parameters.preboot_simulator >>
          steps:
              - preboot_simulator:
                    destination: << parameters.destination >>
    - build_xcode:
          scheme: << parameters.scheme >>
          project: << parameters.project >>
          destination: << parameters.destination >>
          configuration: << parameters.configuration >>
    - test_xcode:
          scheme: << parameters.scheme >>
          project: << parameters.project >>
          destination: << parameters.destination >>
          result_bundle_path: << parameters.result_bundle_path >>
          junit_report: << parameters.junit_report >>
          retry_on_failure: << parameters.retry_on_failure >>
          test_iterations: << parameters.test_iterations >>
    - when:
          condition: << parameters.coverage >>
          steps:
              - export_coverage:
                    type: xcode
                    result_bundle: << parameters.result_bundle_path >>
    - when:
          condition:
              and:
                  - << parameters.coverage >>
                  - << parameters.qlty >>
          steps:
              - upload_qlty_coverage
    - when:
          condition: << parameters.xcode_project >>
          steps:
              - cache_spm:
                    xcode_project: << parameters.xcode_project >>
