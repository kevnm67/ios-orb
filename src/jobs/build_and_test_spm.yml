---
description: |
    Complete CI job for Swift Package Manager projects.
    Builds, tests, exports coverage, and optionally uploads to Qlty Cloud.

executor:
    name: macos
    xcode_version: <<parameters.xcode_version>>
    resource_class: <<parameters.resource_class>>

parameters:
    xcode_version:
        description: Xcode version.
        type: string
        default: '26.6'
    resource_class:
        description: macOS resource class.
        type: string
        default: m4pro.medium
    parallelism:
        description: CircleCI parallelism level.
        type: integer
        default: 1
    coverage:
        description: Whether to export code coverage.
        type: boolean
        default: true
    qlty:
        description: Whether to upload coverage to Qlty Cloud.
        type: boolean
        default: true
    build_flags:
        description: Additional flags to pass to swift build.
        type: string
        default: ''
    configuration:
        description: Build configuration (debug or release).
        type: string
        default: debug
    filter:
        description: Test filter pattern.
        type: string
        default: ''
    pre_steps:
        description: Steps to run before build.
        type: steps
        default: []
    parallel:
        description: Whether to run tests in parallel.
        type: boolean
        default: true
    report_path:
        description: Directory the JUnit report is written to and stored from.
        type: string
        default: build/reports
    test_framework:
        description: |
            Which test framework to run: "auto" detects Swift Testing by
            grepping Tests/ for "import Testing" (falling back to xctest),
            "xctest" and "swift-testing" force a framework. swift-testing
            forces --parallel and writes an xunit report instead of
            xcbeautify's JUnit reporter.
        type: enum
        enum: [auto, xctest, swift-testing]
        default: auto
    allow_beta_xcode:
        description: Whether to allow a beta/build-string xcode_version (e.g. "27A5228h") instead of failing fast.
        type: boolean
        default: false

parallelism: << parameters.parallelism >>

steps:
    - assert_xcode_channel:
          xcode_version: << parameters.xcode_version >>
          allow_beta: << parameters.allow_beta_xcode >>
    - checkout
    - << parameters.pre_steps >>
    - restore_spm_cache:
          key: spm-v2
    - build_spm:
          build_flags: << parameters.build_flags >>
          configuration: << parameters.configuration >>
    - test_spm:
          filter: << parameters.filter >>
          coverage: << parameters.coverage >>
          parallel: << parameters.parallel >>
          report_path: << parameters.report_path >>
          test_framework: << parameters.test_framework >>
    - when:
          condition: << parameters.coverage >>
          steps:
              - export_coverage:
                    type: spm
    - when:
          condition:
              and:
                  - << parameters.coverage >>
                  - << parameters.qlty >>
          steps:
              - upload_qlty_coverage:
                    file: coverage.lcov
                    format: lcov
    - cache_spm:
          key: spm-v2
          path: .build
