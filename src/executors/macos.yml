---
description: |
    macos xcode executor.
    Supported xcode versions: https://circleci.com/docs/guides/execution-managed/using-macos/#supported-xcode-versions-silicon
parameters:
    xcode_version:
        description: Xcode version.
        type: string
        default: '26.6'
    resource_class:
        description: macOS resource class.
        type: string
        default: m4pro.medium
macos:
    xcode: << parameters.xcode_version >>
resource_class: << parameters.resource_class >>
environment:
    HOMEBREW_NO_AUTO_UPDATE: '1'
    HOMEBREW_NO_INSTALL_CLEANUP: '1'
